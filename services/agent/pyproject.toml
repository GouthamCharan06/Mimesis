[project]
name = "mimesis-agent"
version = "0.1.0"
description = "Mimesis Agentic AI Creative Director - Backend Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.7.0,<3.0",
    "google-adk>=1.2.0,<2.0",
    "langgraph>=0.4.0,<1.0",
    "langgraph-checkpoint>=2.0.0,<3.0",
    "langchain-core>=0.3.0,<1.0",
    "langchain-google-genai>=2.1.0,<3.0",
    "google-genai>=1.14.0,<2.0",
    "parallel-web>=1.0.1",
    "google-cloud-firestore>=2.20.0,<3.0",
    "google-cloud-storage>=2.19.0,<3.0",
    "google-cloud-secret-manager>=2.22.0,<3.0",
    "sse-starlette>=2.2.0,<3.0",
    "httpx>=0.28.0,<1.0",
    "structlog>=24.4.0,<26.0",
    "tenacity>=9.0.0,<10.0",
    "python-dotenv>=1.0.0,<2.0",
    "uuid7>=0.1.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.25.0,<1.0",
    "pytest-cov>=6.0.0,<7.0",
    "httpx>=0.28.0,<1.0",
    "ruff>=0.8.0,<1.0",
    "mypy>=1.14.0,<2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

